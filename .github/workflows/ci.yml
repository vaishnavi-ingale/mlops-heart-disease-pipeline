name: MLOps Continuous Integration Pipeline

# Trigger the automated quality checks on every push to the main development track
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-assurance:
    runs-on: ubuntu-latest # Cloud hosted Linux machine matching your local system configuration

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Initialize System Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # High-stability enterprise standard deployment target

    - name: Install Project Workspace Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Automated Data Ingestion In the Cloud
      run: |
        python src/download_data.py

    - name: Run Automated Quality Test Suites
      run: |
        pytest tests/
