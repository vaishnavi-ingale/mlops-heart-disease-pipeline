apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-heart-disease-deployment
  labels:
    app: heart-disease-api
spec:
  replicas: 2 # Task 7 Requirement: Instantly scales 2 isolated application copies for redundancy
  selector:
    matchLabels:
      app: heart-disease-api
  template:
    metadata:
      labels:
        app: heart-disease-api
    spec:
      containers:
      - name: api-server
        image: heart-disease-api:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: heart-disease-service
spec:
  type: LoadBalancer # Task 7 & 8: Exposes the cluster infrastructure safely to user network traffic
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: heart-disease-api
